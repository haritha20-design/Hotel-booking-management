<!DOCTYPE html>
<html>

<head>

    <title>Payment Success - Royal Hotel</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
        }

        header {
            background-color: #1748d1;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-style: italic;
        }

        nav {
            background-color: #43d51b;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-weight: bold;
            margin: 0 20px;
        }

        nav a:hover {
            color: white;
        }

        .success-box {
            width: 550px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px gray;
            box-sizing: border-box;
        }

        .check {
            font-size: 60px;
            color: green;
            margin-bottom: 10px;
        }

        .success-box h2 {
            color: green;
            margin-bottom: 10px;
        }

        .success-box p {
            color: #555;
        }

        .details {
            background-color: #fffbea;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            margin: 15px 0;
        }

        .label {
            width: 170px;
            font-weight: bold;
        }

        .colon {
            width: 20px;
        }

        .value {
            color: #444;
        }

        .amount {
            background-color: #dff5e4;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: center;
            color: #1748d1;
            font-size: 20px;
            font-weight: bold;
        }

        .home-button {
            margin-top: 30px;
            text-align: center;
        }

        .home-button button {
            background-color: #168bd5;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .home-button button:hover {
            background-color: #0c6ca9;
        }

        @media (max-width: 600px) {

            nav a {
                display: block;
                margin: 10px;
            }

            .success-box {
                width: 90%;
                margin: 30px auto;
                padding: 20px;
            }

            .detail-row {
                display: block;
                margin: 20px 0;
            }

            .label {
                width: 100%;
                margin-bottom: 5px;
            }

            .colon {
                display: none;
            }

            .value {
                display: block;
            }

            .home-button button {
                width: 90%;
            }

        }

    </style>

</head>


<body>


    <header>

        <h1>ROYAL HOTEL</h1>

    </header>


    <nav>

        <a href="home.html">Home</a> |

        <a href="booking.html">Room Booking</a> |

        <a href="confirmation.html">Confirmation</a> |

        <a href="payment.html">Payment</a> |

        <a href="bookinghistory.html">history</a> |

        <a href="contact.html">contact us</a> |

        <a href="logout.html">Logout</a>

    </nav>


    <div class="success-box">


        <div class="check">
            ✓
        </div>


        <h2>
            Payment Successful!
        </h2>


        <p>
            Your payment has been completed successfully.
        </p>


        <div class="details">


            <div class="detail-row">

                <div class="label">
                    Customer Name
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value"
                     id="customerName">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Room Type
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value"
                     id="roomType">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Number of Days
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value"
                     id="days">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Payment Mode
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value"
                     id="paymentMode">
                </div>

            </div>


            <div class="amount"
                 id="totalAmount">
            </div>


        </div>


        <div class="home-button">

            <button onclick="goHome()">
                Back to Home
            </button>

        </div>


    </div>


   <script>

let bookingData =
    JSON.parse(
        localStorage.getItem("bookingData")
    );

let paymentMode =
    localStorage.getItem("paymentMode");


if (!bookingData) {

    alert("Booking details not found.");

    window.location.href = "booking.html";

}


/* Display details */

document.getElementById("customerName").innerText =
    bookingData.customerName;

document.getElementById("roomType").innerText =
    bookingData.roomType;

document.getElementById("days").innerText =
    bookingData.days + " Day(s)";

document.getElementById("paymentMode").innerText =
    paymentMode;

document.getElementById("totalAmount").innerText =
    "Total Amount : ₹ " +
    bookingData.totalAmount;


/* Save Booking History */

let history =
    JSON.parse(
        localStorage.getItem("bookingHistory")
    ) || [];


history.push({

    customerName: bookingData.customerName,

    phoneNumber: bookingData.phoneNumber,

    roomType: bookingData.roomType,

    checkIn: bookingData.checkIn,

    checkOut: bookingData.checkOut,

    guests: bookingData.guests,

    days: bookingData.days,

    totalAmount: bookingData.totalAmount,

    paymentMode: paymentMode,

    status: "Confirmed"

});


localStorage.setItem(
    "bookingHistory",
    JSON.stringify(history)
);


/* Back to Home */

function goHome() {

    window.location.href =
        "home.html";

}

</script>
</body>
</html>
