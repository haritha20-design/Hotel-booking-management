<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logout - Grand Stay</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef5ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* Main Card */
.logout-card{
    width:430px;
    background:white;
    padding:45px 35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,0.12);
}

/* Logo */
.logo{
    width:75px;
    height:75px;
    object-fit:contain;
    margin-bottom:18px;
}

/* Logout Icon */
.logout-icon{
    width:70px;
    height:70px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#eef5ff;
    color:#003b73;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
}

/* Heading */
h1{
    color:#003b73;
    margin-bottom:12px;
    font-size:30px;
}

.description{
    color:#666;
    line-height:1.6;
    margin-bottom:28px;
    font-size:15px;
}

/* Logout Button */
.logout-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#003b73;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.logout-btn:hover{
    background:#0056a6;
}

/* Cancel */
.cancel-btn{
    display:block;
    margin-top:16px;
    color:#003b73;
    text-decoration:none;
    font-size:14px;
}

.cancel-btn:hover{
    text-decoration:underline;
}


/* Popup Background */
.popup-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    justify-content:center;
    align-items:center;
}

/* Popup */
.popup{
    width:390px;
    background:white;
    padding:32px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.popup-icon{
    width:58px;
    height:58px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#eef5ff;
    color:#003b73;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:bold;
}

.popup h2{
    color:#003b73;
    margin-bottom:10px;
    font-size:23px;
}

.popup p{
    color:#666;
    line-height:1.5;
    margin-bottom:22px;
}

/* Popup Buttons */
.popup-buttons{
    display:flex;
    gap:12px;
}

.popup-buttons button{
    flex:1;
    padding:12px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.cancel-popup{
    background:white;
    border:1px solid #ccc;
}

.cancel-popup:hover{
    background:#f5f5f5;
}

.confirm-popup{
    background:#003b73;
    border:none;
    color:white;
}

.confirm-popup:hover{
    background:#0056a6;
}


/* Success Section */
.success-section{
    display:none;
}

.success-icon{
    width:75px;
    height:75px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#e8f7ee;
    color:#198754;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    animation:successPop 0.4s ease;
}

@keyframes successPop{

    from{
        transform:scale(0.5);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.success-section h1{
    color:#198754;
}

/* Login Again */
.login-again{
    display:inline-block;
    margin-top:8px;
    padding:13px 30px;
    background:#003b73;
    color:white;
    text-decoration:none;
    border-radius:9px;
    font-weight:bold;
}

.login-again:hover{
    background:#0056a6;
}


/* Mobile */
@media(max-width:500px){

    .logout-card{
        width:100%;
        padding:35px 25px;
    }

    .popup{
        width:90%;
        padding:28px 22px;
    }

}

</style>
</head>

<body>


<!-- Main Logout Card -->

<div class="logout-card">

    <!-- Logout Section -->

    <div id="logoutSection">

        <img src="images/logo.png"
             alt="Grand Stay Logo"
             class="logo">

        <div class="logout-icon">
            ⇥
        </div>

        <h1>Logout</h1>

        <p class="description">
            Are you sure you want to logout from your
            Grand Stay account?
        </p>

        <button class="logout-btn" onclick="showPopup()">
            Logout
        </button>

        <a href="home.html" class="cancel-btn">
            Cancel
        </a>

    </div>


    <!-- Success Section -->

    <div id="successSection" class="success-section">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Logged Out
        </h1>

        <p class="description">
            You have been successfully logged out.
        </p>

        <a href="login.html" class="login-again">
            Login Again
        </a>

    </div>

</div>



<!-- Confirmation Popup -->

<div class="popup-bg" id="popup">

    <div class="popup">

        <div class="popup-icon">
            ?
        </div>

        <h2>
            Confirm Logout
        </h2>

        <p>
            Are you sure you want to logout from
            your Grand Stay account?
        </p>

        <div class="popup-buttons">

            <button class="cancel-popup"
                    onclick="closePopup()">
                Cancel
            </button>

            <button class="confirm-popup"
                    onclick="confirmLogout()">
                Logout
            </button>

        </div>

    </div>

</div>



<script>

/* Show Popup */

function showPopup(){

    document.getElementById("popup").style.display = "flex";

}


/* Close Popup */

function closePopup(){

    document.getElementById("popup").style.display = "none";

}


/* Confirm Logout */

function confirmLogout(){

    // Login status remove
    localStorage.removeItem("isLoggedIn");

    // Close popup
    document.getElementById("popup").style.display = "none";

    // Hide logout section
    document.getElementById("logoutSection").style.display = "none";

    // Show success message
    document.getElementById("successSection").style.display = "block";

}

</script>

</body>
</html>
