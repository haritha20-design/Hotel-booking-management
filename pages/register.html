<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Grand Stay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f8fc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 900px;
            min-height: 560px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        /* LEFT SIDE */

        .left {
            width: 45%;
            background: linear-gradient(
                rgba(0, 40, 90, 0.65),
                rgba(0, 40, 90, 0.65)
            ),
            url("images/hotel.png");

            background-size: cover;
            background-position: center;

            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .left img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .left h1 {
            font-size: 30px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .left p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.95;
        }

        /* RIGHT SIDE */

        .right {
            width: 55%;
            padding: 45px 50px;
        }

        .right h2 {
            color: #123b68;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #1769aa;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.1);
        }

        /* PASSWORD RULES */

        .password-rules {
            background: #f5f9fd;
            border-radius: 8px;
            padding: 10px 13px;
            margin-top: -5px;
            margin-bottom: 17px;
            font-size: 12px;
            color: #666;
        }

        .password-rules p {
            margin: 3px 0;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: #777;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #0d4f85;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-text a {
            color: #1769aa;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .container {
                width: 100%;
                flex-direction: column;
            }

            .left {
                width: 100%;
                min-height: 220px;
            }

            .left img {
                width: 65px;
                height: 65px;
                margin-bottom: 10px;
            }

            .left h1 {
                font-size: 24px;
            }

            .right {
                width: 100%;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="left">

            <img src="images/logo.png" alt="Grand Stay Logo">

            <h1>GRAND STAY</h1>

            <p>
                Create your account and enjoy
                a comfortable and memorable stay
                with Grand Stay.
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register to start booking your perfect stay.
            </p>


            <!-- NAME -->

            <div class="input-group">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">Create Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a strong password"
                    oninput="checkPassword()"
                >

            </div>


            <!-- PASSWORD RULES -->

            <div class="password-rules">

                <p id="length" class="invalid">
                    ✗ Minimum 8 characters
                </p>

                <p id="upper" class="invalid">
                    ✗ One uppercase letter
                </p>

                <p id="lower" class="invalid">
                    ✗ One lowercase letter
                </p>

                <p id="number" class="invalid">
                    ✗ One number
                </p>

                <p id="special" class="invalid">
                    ✗ One special character
                </p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="button"
                class="register-btn"
                onclick="registerUser()"
            >
                Create Account
            </button>


            <p id="message" class="message"></p>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

    </div>


    <script>

        // PASSWORD VALIDATION

        function checkPassword() {

            const password =
                document.getElementById("password").value;


            // Minimum 8 characters

            if (password.length >= 8) {

                document.getElementById("length").innerHTML =
                    "✓ Minimum 8 characters";

                document.getElementById("length").className =
                    "valid";

            } else {

                document.getElementById("length").innerHTML =
                    "✗ Minimum 8 characters";

                document.getElementById("length").className =
                    "invalid";
            }


            // Uppercase

            if (/[A-Z]/.test(password)) {

                document.getElementById("upper").innerHTML =
                    "✓ One uppercase letter";

                document.getElementById("upper").className =
                    "valid";

            } else {

                document.getElementById("upper").innerHTML =
                    "✗ One uppercase letter";

                document.getElementById("upper").className =
                    "invalid";
            }


            // Lowercase

            if (/[a-z]/.test(password)) {

                document.getElementById("lower").innerHTML =
                    "✓ One lowercase letter";

                document.getElementById("lower").className =
                    "valid";

            } else {

                document.getElementById("lower").innerHTML =
                    "✗ One lowercase letter";

                document.getElementById("lower").className =
                    "invalid";
            }


            // Number

            if (/[0-9]/.test(password)) {

                document.getElementById("number").innerHTML =
                    "✓ One number";

                document.getElementById("number").className =
                    "valid";

            } else {

                document.getElementById("number").innerHTML =
                    "✗ One number";

                document.getElementById("number").className =
                    "invalid";
            }


            // Special character

            if (/[@#$%!&*]/.test(password)) {

                document.getElementById("special").innerHTML =
                    "✓ One special character";

                document.getElementById("special").className =
                    "valid";

            } else {

                document.getElementById("special").innerHTML =
                    "✗ One special character";

                document.getElementById("special").className =
                    "invalid";
            }

        }


        // REGISTER FUNCTION

        function registerUser() {

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            // Check empty fields

            if (
                name === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                message.innerHTML =
                    "Please fill all fields.";

                message.style.color = "red";

                return;
            }


            // Strong password

            const strongPassword =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@#$%!&*]).{8,}$/;


            if (!strongPassword.test(password)) {

                message.innerHTML =
                    "Please create a strong password.";

                message.style.color = "red";

                return;
            }


            // Confirm password

            if (password !== confirmPassword) {

                message.innerHTML =
                    "Passwords do not match.";

                message.style.color = "red";

                return;
            }


            // Store user details

            const user = {

                name: name,

                email: email,

                password: password

            };


            localStorage.setItem(
                "hotelUser",
                JSON.stringify(user)
            );


            message.innerHTML =
                "Registration successful!";

            message.style.color = "green";


            // Go to login page

            setTimeout(function() {

                window.location.href = "login.html";

            }, 1000);

        }

    </script>

</body>
</html>
