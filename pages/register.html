<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Hotel Booking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            min-height: 650px;
            background: white;
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        /* LEFT SIDE */

        .left {
            width: 45%;
            position: relative;
            overflow: hidden;
        }

        .left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            color: white;
        }

        .overlay h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .overlay p {
            font-size: 16px;
            line-height: 1.6;
        }

        /* RIGHT SIDE */

        .right {
            width: 55%;
            padding: 45px 55px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: #003b95;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .logo-section h2 {
            margin-top: 12px;
            color: #003b95;
            font-size: 25px;
        }

        .logo-section p {
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 13px 42px 13px 14px;
            border: 1px solid #aaa;
            border-radius: 5px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #0071c2;
            box-shadow: 0 0 0 2px rgba(0, 113, 194, 0.1);
        }

        .eye {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #555;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 15px 0;
            font-size: 13px;
            color: #555;
        }

        .terms input {
            margin-top: 2px;
        }

        .terms a {
            color: #0071c2;
            text-decoration: none;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #0071c2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #005999;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .login-link a {
            color: #0071c2;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            body {
                padding: 15px;
            }

            .container {
                display: block;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT IMAGE -->

        <div class="left">

            <img src="images/hotel.png" alt="Hotel">

            <div class="overlay">
                <h1>Your Perfect Stay</h1>
                <p>
                    Create your account and discover
                    comfortable rooms and memorable stays.
                </p>
            </div>

        </div>


        <!-- RIGHT REGISTER FORM -->

        <div class="right">

            <div class="logo-section">

                <div class="logo">
                    <img src="images/logo.png" alt="Hotel">
                </div>

                <h2>Create an account</h2>

                <p>Join us and start booking your stay</p>

            </div>


            <form id="registerForm">

                <div class="form-group">
                    <label>Full Name</label>

                    <div class="input-box">
                         <input
                            type="text"
                            id="fullname"
                            placeholder="Enter your full name"
                            required>
                    </div>
                </div>


                <div class="form-group">
                    <label>Email Address</label>

                    <div class="input-box">
                         <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>
                    </div>
                </div>


                <div class="form-group">
                    <label>Username</label>

                    <div class="input-box">
                        <input
                           type="text"
                           id="username"
                           placeholder="Choose a username"
                           required>
                    </div>
                </div>


                <div class="form-group">
                    <label>Password</label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required>

                        <span
                            class="eye"
                            onclick="togglePassword('password', this)">
                            👁
                        </span>

                    </div>
                </div>


                <div class="form-group">
                    <label>Confirm Password</label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required>

                        <span
                            class="eye"
                            onclick="togglePassword('confirmPassword', this)">
                            👁
                        </span>

                    </div>
                </div>


                <div class="terms">

                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms and Conditions</a>
                    </label>

                </div>


                <button type="submit" class="register-btn">
                    Create Account
                </button>

                <div class="message" id="message"></div>

            </form>


            <div class="login-link">
                Already have an account?
                <a href="login.html">Sign in</a>
            </div>

        </div>

    </div>


    <script>

        // SHOW / HIDE PASSWORD

        function togglePassword(id, icon) {

            const input = document.getElementById(id);

            if (input.type === "password") {

                input.type = "text";
                icon.textContent = "🙈";

            } else {

                input.type = "password";
                icon.textContent = "👁";

            }
        }


        // REGISTER

        document.getElementById("registerForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const fullname =
                document.getElementById("fullname").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            // CHECK PASSWORD

            if (password !== confirmPassword) {

                message.style.color = "red";
                message.textContent = "Passwords do not match.";

                return;
            }


            // SAVE USER

            const user = {
                fullname: fullname,
                email: email,
                username: username,
                password: password
            };

            localStorage.setItem(
                "hotelUser",
                JSON.stringify(user)
            );


            message.style.color = "green";
            message.textContent =
                "Account created successfully!";


            // GO TO LOGIN

            setTimeout(function() {

                window.location.href = "login.html";

            }, 1500);

        });

    </script>

</body>
</html>
