<!DOCTYPE html>
<html>

<head>

    <title>Booking Confirmation</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
        }

        header {
            background-color: #1748d1;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-style: italic;
        }

        nav {
            background-color: #43d51b;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-weight: bold;
            margin: 0 20px;
        }

        nav a:hover {
            color: white;
        }

        .page-title {
            text-align: center;
            margin: 30px;
            color: #222;
        }

        .confirmation-box {
            width: 550px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;
            box-sizing: border-box;
        }

        .success {
            text-align: center;
            color: green;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .details {
            background-color: #fffbea;
            padding: 20px;
            border-radius: 10px;
        }

        .detail-row {
            display: flex;
            margin: 15px 0;
        }

        .label {
            width: 180px;
            font-weight: bold;
        }

        .colon {
            width: 20px;
        }

        .value {
            color: #444;
        }

        .amount {
            margin-top: 20px;
            padding: 15px;
            background-color: #dff5e4;
            border-radius: 8px;
            text-align: center;
            color: #1748d1;
            font-size: 20px;
            font-weight: bold;
        }

        .button {
            text-align: center;
            margin-top: 30px;
        }

        .pay-btn {
            background-color: #168bd5;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .pay-btn:hover {
            background-color: #0c6ca9;
        }

        @media (max-width: 600px) {

            nav a {
                display: block;
                margin: 10px;
            }

            .confirmation-box {
                width: 90%;
                padding: 20px;
                margin: 30px auto;
            }

            .detail-row {
                display: block;
                margin: 20px 0;
            }

            .label {
                width: 100%;
                margin-bottom: 5px;
            }

            .colon {
                display: none;
            }

            .value {
                display: block;
            }

            .pay-btn {
                width: 90%;
            }

        }

    </style>

</head>


<body>

    <header>

        <h1>ROYAL HOTEL</h1>

    </header>


    <nav>

        <a href="home.html">Home</a> |

        <a href="booking.html">Room Booking</a> |

        <a href="confirmation.html">Confirmation</a> |

        <a href="payment.html">Payment</a> |

        <a href="bookinghistory.html">history</a> |

        <a href="contact.html">contact us</a> |

        <a href="logout.html">Logout</a>

    </nav>


    <h2 class="page-title">
        BOOKING CONFIRMATION
    </h2>


    <div class="confirmation-box">

        <div class="success">
            ✓ Booking Details
        </div>


        <div class="details">

            <div class="detail-row">

                <div class="label">
                    Customer Name
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="customerName">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Phone Number
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="phoneNumber">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Room Type
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="roomType">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Check-in Date
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="checkIn">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Check-out Date
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="checkOut">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Number of Guests
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="guests">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Number of Days
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="days">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Room Rate
                </div>

                <div class="colon">:</div>

                <div class="value"
                     id="roomRate">
                </div>

            </div>


            <div class="amount"
                 id="totalAmount">
            </div>

        </div>


        <div class="button">

            <button class="pay-btn"
                    onclick="goToPayment()">

                Proceed to Payment

            </button>

        </div>


    </div>


    <script>

        /* Get booking data */

        let bookingData =
            JSON.parse(
                localStorage.getItem("bookingData")
            );


        /* Check data */

        if (!bookingData) {

            alert("No booking details found.");

            window.location.href =
                "booking.html";

        }


        /* Display details */

        document.getElementById("customerName").innerText =
            bookingData.customerName;

        document.getElementById("phoneNumber").innerText =
            bookingData.phoneNumber;

        document.getElementById("roomType").innerText =
            bookingData.roomType;

        document.getElementById("checkIn").innerText =
            bookingData.checkIn;

        document.getElementById("checkOut").innerText =
            bookingData.checkOut;

        document.getElementById("guests").innerText =
            bookingData.guests;

        document.getElementById("days").innerText =
            bookingData.days + " Day(s)";

        document.getElementById("roomRate").innerText =
            "₹ " + bookingData.roomRate + " / Day";


        /* Automatic Total Amount */

        document.getElementById("totalAmount").innerText =
            "Total Amount : ₹ " +
            bookingData.totalAmount;


        /* Go to Payment */

        function goToPayment() {

            window.location.href =
                "payment.html";

        }

    </script>


</body>

</html>
