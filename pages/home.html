<!DOCTYPE html>
<html>

<head>

    <title>Home Page</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #c4c3da;
        }

        header {
            background-color: #1555d1;
            color: white;
            text-align: center;
            padding: 12px;
        }

        header h2 {
            margin: 0;
            font-size: 20px;
        }

        nav {
            background-color: #55d61c;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: #222;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: white;
        }

        .welcome {
            display: block;
            width: 55%;
            margin: 20px auto;
            text-align: center;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
        }

        .welcome h3 {
            color: #555;
            margin: 0;
            padding: 10px;
        }

        .welcome p {
            color: #555;
        }

        .welcome img {
            width: 80%;
            height: 280px;
            object-fit: cover;
            border-radius: 5px;
        }

        .rooms {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 30px;
        }

        .room-card {
            width: 200px;
            text-align: center;
            background-color: white;
        }

        .room-title {
            background-color: #f5a900;
            color: #222;
            padding: 18px 10px;
            font-weight: bold;
        }

        .room-card h2 {
            background-color: white;
            margin: 0;
            padding: 10px;
        }

        .next-button {
            text-align: center;
            margin: 35px;
        }

        .next-button button {
            background-color: #1684d8;
            color: white;
            border: none;
            padding: 12px 45px;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
        }

        .next-button button:hover {
            background-color: #0d5fa3;
        }


        /* Phone Screen */

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            nav {
                padding: 10px;
            }

            nav a {
                display: block;
                margin: 10px;
            }

            .welcome {
                width: 90%;
                margin: 20px auto;
            }

            .welcome img {
                width: 100%;
                height: auto;
            }

            .rooms {
                display: block;
                width: 90%;
                margin: 30px auto;
            }

            .room-card {
                width: 100%;
                margin-bottom: 20px;
            }

            .next-button button {
                width: 90%;
            }

        }

    </style>

</head>


<body>


    <header>

        <h2>
            <b><i>ROYAL HOTEL</i></b>
        </h2>

    </header>


    <nav>

        <a href="home.html">Home</a> |

        <a href="booking.html">Room Booking</a> |

        <a href="confirmation.html">Confirmation</a> |

        <a href="payment.html">Payment</a> |

        <a href="bookinghistory.html">history</a>

        <a href="contact.html">contact us</a> |

        <a href="logout.html">Logout</a>

    </nav>


    <section class="welcome">

        <h3>Welcome To Royal Hotel</h3>

        <p>
            Book your stay with comfort and luxury
        </p>

        <img src="images/hotel.jpg"
             alt="Royal Hotel">

    </section>


    <section class="rooms">


        <div class="room-card">

            <div class="room-title">
                TOTAL ROOMS
            </div>

            <h2 id="totalRooms">
                120
            </h2>

        </div>


        <div class="room-card">

            <div class="room-title">
                AVAILABLE ROOMS
            </div>

            <h2 id="availableRooms">
                75
            </h2>

        </div>


        <div class="room-card">

            <div class="room-title">
                BOOKED ROOMS
            </div>

            <h2 id="bookedRooms">
                45
            </h2>

        </div>


    </section>


    <div class="next-button">

        <a href="booking.html">

            <button>
                Next
            </button>

        </a>

    </div>


    <!-- JavaScript -->

    <script>

        let availableRooms =
            Number(localStorage.getItem("availableRooms")) || 75;

        let bookedRooms =
            Number(localStorage.getItem("bookedRooms")) || 45;


        document.getElementById("availableRooms").innerText =
            availableRooms;

        document.getElementById("bookedRooms").innerText =
            bookedRooms;


    </script>


</body>

</html>
