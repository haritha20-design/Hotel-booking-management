<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Grand Stay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 1000px;
            min-height: 590px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        /* Left Image */
        .left-section {
            width: 48%;
            background-image: url("images/hotel.png");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .left-section::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 45, 85, 0.55);
        }

        .welcome-text {
            position: absolute;
            z-index: 2;
            left: 40px;
            right: 40px;
            bottom: 50px;
            color: white;
        }

        .welcome-text h2 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .welcome-text p {
            font-size: 15px;
            line-height: 1.7;
        }

        /* Right Section */
        .right-section {
            width: 52%;
            padding: 55px 50px;
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            color: #12395b;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
        }

        .input-box input {
            width: 100%;
            height: 52px;
            border: 1px solid #d0d8e2;
            border-radius: 8px;
            padding: 0 15px 0 43px;
            font-size: 15px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        /* Password */
        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;
            height: 52px;
            border: 1px solid #d0d8e2;
            border-radius: 8px;
            padding: 0 45px 0 15px;
            font-size: 15px;
            outline: none;
        }

        .password-box input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .show-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 17px;
        }

        /* Forgot */
        .forgot {
            text-align: right;
            margin-bottom: 22px;
        }

        .forgot a {
            color: #1976d2;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #125ca5;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .divider {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin: 28px 0 20px;
        }

        .register {
            text-align: center;
            font-size: 14px;
            color: #555;
        }

        .register a {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        .security {
            text-align: center;
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }

        /* Mobile */
        @media (max-width: 750px) {

            .left-section {
                display: none;
            }

            .right-section {
                width: 100%;
                padding: 40px 25px;
            }

            .login-container {
                min-height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Left -->
        <div class="left-section">

            <div class="welcome-text">
                <h2>Welcome Back</h2>

                <p>
                    Sign in to continue your journey
                    with Grand Stay and manage your hotel booking easily.
                </p>
            </div>

        </div>


        <!-- Right -->
        <div class="right-section">

            <img src="images/logo.png"
                 alt="Grand Stay Logo"
                 class="logo">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to your Grand Stay account
            </p>


            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <span class="input-icon">✉️</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                            required>

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()">
                            👁
                        </button>

                    </div>

                </div>


                <!-- Forgot Password -->
                <div class="forgot">

                    <a href="forgotpass.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login -->
                <button type="submit" class="login-btn">
                    Sign In
                </button>

                <p id="message" class="message"></p>

            </form>


            <div class="divider">
                New to Grand Stay?
            </div>


            <div class="register">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <div class="security">
                🔒 Your login information is secure.
            </div>

        </div>

    </div>


    <script>

        // Show / Hide Password
        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙌🏻";

            } else {

                password.type = "password";
                button.textContent = "👁";

            }
        }


        // Login
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            const savedUser =
                localStorage.getItem("hotelUser");


            if (!savedUser) {

                message.style.color = "red";

                message.textContent =
                    "No registered account found.";

                return;
            }


            const user =
                JSON.parse(savedUser);


            if (
                email.toLowerCase() ===
                user.email.toLowerCase()
                &&
                password === user.password
            ) {

                message.style.color = "green";

                message.textContent =
                    "Login successful!";


                setTimeout(function() {

                    window.location.href =
                        "home.html";

                }, 1000);

            } else {

                message.style.color = "red";

                message.textContent =
                    "Invalid email or password.";

            }

        });

    </script>

</body>
</html>
