<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Grand Stay</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f8fd;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        /* Main Container */

        .login-container {
            width: 900px;
            min-height: 560px;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 15px 40px rgba(0, 40, 80, 0.15);
        }


        /* Left Side */

        .login-image {
            position: relative;
            background-image:
                linear-gradient(
                    rgba(0, 45, 90, 0.55),
                    rgba(0, 45, 90, 0.55)
                ),
                url("images/hotel.png");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .image-content h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .image-content p {
            font-size: 16px;
            line-height: 1.7;
        }


        /* Right Side */

        .login-form {
            padding: 55px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .login-form h2 {
            color: #003b73;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }


        /* Input */

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5dce5;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #0056a6;
            box-shadow: 0 0 0 3px rgba(0, 86, 166, 0.08);
        }


        /* Password */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 18px;
        }


        /* Forgot Password */

        .forgot {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #0056a6;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .forgot a:hover {
            text-decoration: underline;
        }


        /* Login Button */

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #003b73;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0056a6;
        }


        /* Message */

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }


        /* Register */

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .register-text a {
            color: #0056a6;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }


        /* Security */

        .security {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }


        /* Mobile */

        @media (max-width: 768px) {

            .login-container {
                width: 100%;
                grid-template-columns: 1fr;
            }

            .login-image {
                min-height: 230px;
            }

            .image-content h1 {
                font-size: 30px;
            }

            .login-form {
                padding: 40px 30px;
            }
        }


        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-image {
                min-height: 200px;
            }

            .login-form {
                padding: 30px 22px;
            }

            .login-form h2 {
                font-size: 26px;
            }
        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LEFT IMAGE -->

        <div class="login-image">

            <div class="image-content">

                <h1>GRAND STAY</h1>

                <p>
                    Welcome back!<br>
                    Sign in to continue your hotel
                    booking journey.
                </p>

            </div>

        </div>



        <!-- LOGIN FORM -->

        <div class="login-form">


            <img src="images/logo.png"
                 alt="Grand Stay Logo"
                 class="logo">


            <h2>Welcome Back</h2>

            <p class="subtitle">
                Sign in to your Grand Stay account
            </p>



            <!-- Email -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>



            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                        id="eyeButton">

                        👁️

                    </button>

                </div>

            </div>



            <!-- Forgot Password -->

            <div class="forgot">

                <a href="forgotpass.html">
                    Forgot Password?
                </a>

            </div>



            <!-- Login -->

            <button
                class="login-btn"
                onclick="loginUser()">

                Sign In

            </button>



            <!-- Message -->

            <div
                id="message"
                class="message">
            </div>



            <!-- Register -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>



            <p class="security">
                🔒 Your account information is kept secure.
            </p>


        </div>

    </div>



<script>


    /* Show / Hide Password */

    function togglePassword() {

        const password =
            document.getElementById("password");

        const eye =
            document.getElementById("eyeButton");


        if (password.type === "password") {

            password.type = "text";

            eye.textContent = "🙈";

        } else {

            password.type = "password";

            eye.textContent = "👁️";

        }

    }



    /* Login */

    function loginUser() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        /* Empty field validation */

        if (email === "" || password === "") {

            message.style.color = "#d93025";

            message.textContent =
                "Please enter email and password.";

            return;

        }


        /* Get registered user */

        const storedUser =
            localStorage.getItem("hotelUser");


        if (!storedUser) {

            message.style.color = "#d93025";

            message.textContent =
                "Account not found. Please create an account.";

            return;

        }


        const user =
            JSON.parse(storedUser);


        /* Check login details */

        if (
            email.toLowerCase() === user.email.toLowerCase()
            &&
            password === user.password
        ) {

            /* Login status */

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );
            // save current user
            localStorage.setItem(
                "currentUser",JSON.stringify(user)
            );


            message.style.color = "#198754";

            message.textContent =
                "Login successful!";


            /* Go to Home */

            setTimeout(function () {

                window.location.href = "home.html";

            }, 800);

        } else {

            message.style.color = "#d93025";

            message.textContent =
                "Invalid email or password.";

        }

    }

</script>


</body>

</html>
