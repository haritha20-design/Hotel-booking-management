<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Grand Stay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff, #d7eaff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 470px;
            background: white;
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 60, 120, 0.15);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #e8f3ff;
            border-radius: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #12395b;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;
            height: 52px;
            padding: 0 48px 0 15px;

            border: 1px solid #d2dae4;
            border-radius: 9px;

            font-size: 15px;
            outline: none;
        }

        .password-box input:focus {
            border-color: #1976d2;

            box-shadow:
                0 0 0 3px rgba(25,118,210,0.1);
        }

        .show-btn {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: none;

            cursor: pointer;
            font-size: 18px;
        }

        .change-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 9px;

            background: #1976d2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 5px;
        }

        .change-btn:hover {
            background: #125ca5;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        .back-login {
            display: block;
            text-align: center;

            margin-top: 25px;

            color: #1976d2;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .security {
            text-align: center;

            margin-top: 25px;
            padding-top: 18px;

            border-top: 1px solid #eee;

            color: #888;
            font-size: 12px;
        }

        @media (max-width: 500px) {

            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Icon -->
        <div class="icon">
            🔑
        </div>


        <h1>Change Password</h1>

        <p class="description">
            Create a new password for your Grand Stay account.
        </p>


        <form id="changePasswordForm">

            <!-- New Password -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword('newPassword', this)">
                        👁
                    </button>

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword('confirmPassword', this)">
                        👁
                    </button>

                </div>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="change-btn">

                Change Password

            </button>


            <p id="message" class="message"></p>

        </form>


        <!-- Back -->

        <a href="login.html" class="back-login">
            ← Back to Login
        </a>


        <!-- Security -->

        <div class="security">
            🔒 Your password will be updated securely.
        </div>

    </div>


    <script>

        // Show / Hide Password

        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁";
            }
        }


        // Change Password

        document
        .getElementById("changePasswordForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            // Password length

            if (newPassword.length < 6) {

                message.style.color = "red";

                message.textContent =
                    "Password must contain at least 6 characters.";

                return;
            }


            // Password match

            if (newPassword !== confirmPassword) {

                message.style.color = "red";

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            // Get registered user

            const savedUser =
                localStorage.getItem("hotelUser");


            if (!savedUser) {

                message.style.color = "red";

                message.textContent =
                    "User account not found.";

                return;
            }


            const user =
                JSON.parse(savedUser);


            // Update password

            user.password = newPassword;


            localStorage.setItem(
                "hotelUser",
                JSON.stringify(user)
            );


            message.style.color = "green";

            message.textContent =
                "Password changed successfully!";


            // Go to Login

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        });

    </script>

</body>
</html>
