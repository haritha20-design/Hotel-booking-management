<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History - Grand Stay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        /* NAVBAR */
        nav {
            background: #0b3d62;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #ffd166;
        }

        /* HEADER */
        .page-header {
            text-align: center;
            padding: 45px 20px 30px;
        }

        .page-header h1 {
            color: #0b3d62;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
        }

        /* USER INFO */
        .user-box {
            width: 86%;
            max-width: 1100px;
            margin: 0 auto 25px;
            background: white;
            padding: 18px 22px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .user-box strong {
            color: #0b3d62;
        }

        /* HISTORY CONTAINER */
        .history-container {
            width: 86%;
            max-width: 1100px;
            margin: auto;
        }

        /* BOOKING CARD */
        .booking-card {
            background: white;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .booking-top {
            background: #0b3d62;
            color: white;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-top h3 {
            font-size: 18px;
        }

        .status {
            background: #198754;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .booking-body {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 22px;
            padding: 22px;
        }

        .room-image {
            width: 180px;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
        }

        .details h2 {
            color: #0b3d62;
            margin-bottom: 10px;
        }

        .details p {
            margin: 7px 0;
            color: #555;
        }

        .details strong {
            color: #333;
        }

        .amount {
            margin-top: 12px;
            font-size: 20px;
            font-weight: bold;
            color: #198754;
        }

        .view-btn {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            background: #0b3d62;
            color: white;
            border-radius: 7px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #082f4b;
        }

        /* EMPTY */
        .empty {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .empty h2 {
            color: #0b3d62;
            margin-bottom: 10px;
        }

        .empty p {
            color: #666;
            margin-bottom: 20px;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 22px;
            background: #0b3d62;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        /* FOOTER */
        footer {
            margin-top: 60px;
            background: #0b3d62;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .booking-body {
                grid-template-columns: 1fr;
            }

            .room-image {
                width: 100%;
                height: 200px;
            }

            .booking-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>

        <div class="logo">
            GRAND STAY
        </div>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="booking.html">Rooms</a>
            <a href="bookinghistory.html">History</a>
            <a href="contact.html">Contact</a>
            <a href="logout.html">Logout</a>
        </div>

    </nav>


    <!-- PAGE HEADER -->

    <section class="page-header">

        <h1>Booking History</h1>

        <p>
            View all your previous and current bookings
        </p>

    </section>


    <!-- USER -->

    <div class="user-box">

        Logged in as:
        <strong id="userEmail">Loading...</strong>

    </div>


    <!-- HISTORY -->

    <div class="history-container">

        <div id="historyList"></div>

    </div>


    <!-- FOOTER -->

    <footer>

        © 2026 Grand Stay Hotel. All Rights Reserved.

    </footer>


<script>

    // Get current logged-in user

    const currentUser =
        JSON.parse(localStorage.getItem("currentUser"));


    const historyList =
        document.getElementById("historyList");


    const userEmail =
        document.getElementById("userEmail");


    // Check login

    if (!currentUser || !currentUser.email) {

        userEmail.textContent = "Not logged in";

        historyList.innerHTML = `

            <div class="empty">

                <h2>Please Login</h2>

                <p>
                    Login to view your booking history.
                </p>

                <a href="login.html" class="home-btn">
                    Login
                </a>

            </div>

        `;

    } 
    
    else {

        // Show user email

        userEmail.textContent =
            currentUser.email;


        // User-specific history key

        const historyKey =
            "bookingHistory_" +
            currentUser.email.toLowerCase();


        // Get booking history

        const bookingHistory =
            JSON.parse(
                localStorage.getItem(historyKey)
            ) || [];


        // No bookings

        if (bookingHistory.length === 0) {

            historyList.innerHTML = `

                <div class="empty">

                    <h2>No Bookings Yet</h2>

                    <p>
                        You haven't made any bookings yet.
                    </p>

                    <a href="booking.html" class="home-btn">
                        Book a Room
                    </a>

                </div>

            `;

        }

        else {

            // Latest booking first

            bookingHistory.reverse();


            bookingHistory.forEach(function(booking) {

                const room =
                    booking.room || {};

                const search =
                    booking.searchDetails || {};

                const guest =
                    booking.guestDetails || {};

                const cost =
                    booking.bookingCost || {};

                const payment =
                    booking.paymentData || {};


                const bookingDate =
                    payment.paymentDate || "N/A";


                historyList.innerHTML += `

                    <div class="booking-card">

                        <div class="booking-top">

                            <h3>
                                Booking ID:
                                ${booking.bookingId || "N/A"}
                            </h3>

                            <span class="status">
                                Confirmed
                            </span>

                        </div>


                        <div class="booking-body">

                            <img
                                src="${room.image || 'images/room.jpg'}"
                                class="room-image"
                                alt="Room"
                            >


                            <div class="details">

                                <h2>
                                    ${room.type || "Hotel Room"}
                                </h2>


                                <p>
                                    <strong>Room Number:</strong>
                                    ${room.roomNumber || "N/A"}
                                </p>


                                <p>
                                    <strong>Guest:</strong>
                                    ${guest.fullName || "N/A"}
                                </p>


                                <p>
                                    <strong>Check-in:</strong>
                                    ${search.checkin || "N/A"}
                                </p>


                                <p>
                                    <strong>Check-out:</strong>
                                    ${search.checkout || "N/A"}
                                </p>


                                <p>
                                    <strong>Guests:</strong>
                                    ${search.guests || guest.guests || "N/A"}
                                </p>


                                <p>
                                    <strong>Rooms:</strong>
                                    ${search.rooms || guest.rooms || "1"}
                                </p>


                                <p>
                                    <strong>Booking Date:</strong>
                                    ${bookingDate}
                                </p>


                                <p>
                                    <strong>Payment:</strong>
                                    ${payment.paymentMethod || "N/A"}
                                </p>


                                <div class="amount">

                                    Total Paid:
                                    ₹${Number(
                                        cost.totalAmount || 0
                                    ).toLocaleString("en-IN")}

                                </div>


                                <button
                                    class="view-btn"
                                    onclick='viewBooking(${JSON.stringify(booking)})'
                                >
                                    View Details
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });

        }

    }


    // View booking details

    function viewBooking(booking) {

        localStorage.setItem(
            "finalBooking",
            JSON.stringify(booking)
        );

        window.location.href =
            "confirmation.html";

    }

</script>

</body>
</html>
