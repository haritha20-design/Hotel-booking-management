<!DOCTYPE html>
<html>

<head>

    <title>Payment - Royal Hotel</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
        }

        /* Header */

        header {
            background-color: #1748d1;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-style: italic;
        }

        /* Navigation */

        nav {
            background-color: #43d51b;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-weight: bold;
            margin: 0 20px;
        }

        nav a:hover {
            color: white;
        }

        /* Title */

        .page-title {
            text-align: center;
            margin: 30px;
            color: #222;
        }

        /* Payment Box */

        .payment-box {
            width: 500px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;
            box-sizing: border-box;
        }

        .payment-box h2 {
            text-align: center;
            color: #1748d1;
        }

        /* Details */

        .details {
            background-color: #fffbea;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .detail-row {
            display: flex;
            margin: 15px 0;
        }

        .label {
            width: 160px;
            font-weight: bold;
        }

        .colon {
            width: 20px;
        }

        .value {
            color: #444;
        }

        /* Amount */

        .amount {
            background-color: #dff5e4;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: center;
            color: #1748d1;
            font-size: 20px;
            font-weight: bold;
        }

        /* Payment Method */

        .payment-method {
            margin-top: 25px;
        }

        .payment-method label {
            display: block;
            margin: 15px 0;
            padding: 12px;
            background-color: #f3f5fa;
            border-radius: 8px;
            cursor: pointer;
        }

        .payment-method input {
            margin-right: 10px;
        }

        /* Pay Button */

        .button {
            text-align: center;
            margin-top: 30px;
        }

        .pay-btn {
            background-color: #168bd5;
            color: white;
            border: none;
            padding: 12px 50px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .pay-btn:hover {
            background-color: #0c6ca9;
        }

        /* Phone */

        @media (max-width: 600px) {

            nav a {
                display: block;
                margin: 10px;
            }

            .payment-box {
                width: 90%;
                padding: 20px;
            }

            .detail-row {
                display: block;
                margin: 20px 0;
            }

            .label {
                width: 100%;
                margin-bottom: 5px;
            }

            .colon {
                display: none;
            }

            .value {
                display: block;
            }

            .pay-btn {
                width: 90%;
            }

        }

    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <h1>ROYAL HOTEL</h1>

    </header>


    <!-- Navigation -->

    <nav>

        <a href="home.html">Home</a> |

        <a href="booking.html">Room Booking</a> |

        <a href="confirmation.html">Confirmation</a> |

        <a href="payment.html">Payment</a> |

        <a href="bookinghistory.html">history</a> |

        <a href="contact.html">contact us</a> |

        <a href="logout.html">Logout</a>

    </nav>


    <h2 class="page-title">
        PAYMENT
    </h2>


    <!-- Payment Box -->

    <div class="payment-box">


        <h2>
            Payment Details
        </h2>


        <!-- Booking Details -->

        <div class="details">


            <div class="detail-row">

                <div class="label">
                    Customer Name
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value"
                     id="customerName">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Room Type
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value"
                     id="roomType">
                </div>

            </div>


            <div class="detail-row">

                <div class="label">
                    Number of Days
                </div>

                <div class="colon">
                    :
                </div>

                <div class="value"
                     id="days">
                </div>

            </div>


            <!-- Automatic Amount -->

            <div class="amount"
                 id="totalAmount">
            </div>


        </div>


        <!-- Payment Method -->

        <div class="payment-method">

            <h3>
                Select Payment Method
            </h3>


            <label>

                <input type="radio"
                       name="payment"
                       value="Cash"
                       required>

                Cash

            </label>


            <label>

                <input type="radio"
                       name="payment"
                       value="Credit Card">

                Credit Card

            </label>


            <label>

                <input type="radio"
                       name="payment"
                       value="Debit Card">

                Debit Card

            </label>


            <label>

                <input type="radio"
                       name="payment"
                       value="Net Banking">

                Net Banking

            </label>

        </div>


        <!-- Pay Button -->

        <div class="button">

            <button class="pay-btn"
                    onclick="makePayment()">

                Pay Now

            </button>

        </div>


    </div>


    <script>


        /* Get Booking Data */

        let bookingData =
            JSON.parse(
                localStorage.getItem("bookingData")
            );


        /* Check Booking Data */

        if (!bookingData) {

            alert("Booking details not found.");

            window.location.href =
                "booking.html";

        }


        /* Display Details */

        document.getElementById("customerName").innerText =
            bookingData.customerName;


        document.getElementById("roomType").innerText =
            bookingData.roomType;


        document.getElementById("days").innerText =
            bookingData.days + " Day(s)";


        /* Display Amount */

        document.getElementById("totalAmount").innerText =
            "Total Amount : ₹ " +
            bookingData.totalAmount;


        /* Payment */

        function makePayment() {


            let selectedPayment =
                document.querySelector(
                    'input[name="payment"]:checked'
                );


            if (!selectedPayment) {

                alert(
                    "Please select a payment method."
                );

                return;

            }


            /* Save Payment Mode */

            localStorage.setItem(
                "paymentMode",
                selectedPayment.value
            );


            /* Go to Payment Success */

            window.location.href =
                "paysuccess.html";

        }

    </script>


</body>

</html>
